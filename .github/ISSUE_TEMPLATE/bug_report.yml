name: Bug report
description: Something does not work or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened?, description: What did you expect instead?}
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes:
      label: Output of `stats-widget doctor`
      render: text
    validations: {required: true}
  - type: input
    id: distro
    attributes: {label: Distribution and desktop, placeholder: "Fedora 45 KDE Plasma 6 (Wayland)"}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Output of `stats-widget logs` (last lines), render: text}
  - type: textarea
    id: shot
    attributes: {label: Screenshot (optional)}
