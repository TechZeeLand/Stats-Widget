name: CI
on:
  push: {branches: [main]}
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck php-cli python3-gi python3-gi-cairo gir1.2-gtk-3.0 python3-fonttools
      - name: Shell scripts
        run: shellcheck install.sh uninstall.sh lib/*.sh distros/*/install.sh widget/bin/stats-widget
      - name: Python
        run: |
          python3 -m compileall -q widget/scripts
          python3 -m unittest discover -s tests -v
      - name: PHP
        run: |
          php -l server/stats.php
          php tests/mdstat_test.php
      - name: Distro detection
        run: |
          for f in fedora rhel debian arch suse generic; do bash -n distros/$f/install.sh; done
